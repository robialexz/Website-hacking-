name: Dependency audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high
